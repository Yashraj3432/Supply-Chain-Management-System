# MySQL 8 for the Supply Chain Management System.
#   docker compose up -d
# Credentials match backend/.env.example.
services:
  mysql:
    image: mysql:8.4
    container_name: scm-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: scm_db
      MYSQL_USER: scm_user
      MYSQL_PASSWORD: scm_password
      MYSQL_ROOT_PASSWORD: root_password
      TZ: Asia/Kolkata
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3307"
    volumes:
      - scm_mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: scm-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - mysql

volumes:
  scm_mysql_data:
